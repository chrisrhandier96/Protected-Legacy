<!-- PP LIBRARY PANEL -->
<style>
.ppl{--ppl-g:var(--verde-oscuro,#0D241C);--ppl-g2:var(--verde,#14352A);--ppl-s:var(--arena,#F5EFE3);--ppl-o:var(--oro,#C29B40);--ppl-fd:var(--display,'Marcellus',Georgia,serif);--ppl-fb:var(--body,'Figtree',system-ui,sans-serif)}
.ppl-tab{position:fixed;right:0;top:50%;z-index:950;transform:translateY(-50%);display:flex;align-items:center;gap:10px;writing-mode:vertical-rl;padding:18px 9px;background:var(--ppl-g);color:var(--ppl-s);border:1px solid rgba(194,155,64,.55);border-right:0;border-radius:6px 0 0 6px;font:600 12px/1 var(--ppl-fb);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:-6px 8px 24px rgba(0,0,0,.2);transition:padding .2s,background .2s}
.ppl-tab:hover{background:var(--ppl-g2);padding-right:13px}
.ppl-tab:focus-visible{outline:2px solid var(--ppl-o);outline-offset:2px}
.ppl-tab svg{width:15px;height:15px;fill:none;stroke:var(--ppl-o);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ppl-scrim{position:fixed;inset:0;z-index:960;background:rgba(8,20,15,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.ppl-panel{position:fixed;top:0;right:0;bottom:0;z-index:970;width:min(380px,88vw);display:flex;flex-direction:column;background:var(--ppl-g);color:var(--ppl-s);border-left:1px solid rgba(194,155,64,.4);box-shadow:-18px 0 48px rgba(0,0,0,.35);transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.22,.8,.24,1),visibility 0s .32s;font-family:var(--ppl-fb)}
.ppl-on .ppl-panel{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.22,.8,.24,1)}
.ppl-on .ppl-scrim{opacity:1;visibility:visible;transition:opacity .25s}
.ppl-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px 18px;border-bottom:1px solid rgba(194,155,64,.25)}
.ppl-title{margin:0;font:400 25px/1.1 var(--ppl-fd);letter-spacing:.02em;color:var(--ppl-s)}
.ppl-x{flex:none;width:38px;height:38px;border-radius:50%;background:none;border:1px solid rgba(245,239,227,.28);color:var(--ppl-s);font:400 20px/1 var(--ppl-fb);cursor:pointer;transition:border-color .15s,color .15s}
.ppl-x:hover{border-color:var(--ppl-o);color:var(--ppl-o)}
.ppl-x:focus-visible{outline:2px solid var(--ppl-o);outline-offset:2px}
.ppl-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 24px 32px}
.ppl-sec{margin-top:24px}
.ppl-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid rgba(194,155,64,.22);font:600 11px/1 var(--ppl-fb);letter-spacing:.2em;text-transform:uppercase;color:var(--ppl-o);text-decoration:none}
.ppl-h span{transition:transform .15s}
.ppl-h:hover span,.ppl-h:focus-visible span{transform:translateX(4px)}
.ppl-list{list-style:none;margin:0;padding:0}
.ppl-list a{position:relative;display:block;padding:9px 0 9px 17px;color:var(--ppl-s);text-decoration:none;font-size:15.5px;line-height:1.35;transition:color .15s,padding .15s}
.ppl-list a::before{content:"";position:absolute;left:2px;top:50%;width:5px;height:5px;margin-top:-3px;background:var(--ppl-o);transform:rotate(45deg);opacity:.55}
.ppl-list a:hover,.ppl-list a[aria-current="page"]{color:var(--ppl-o);padding-left:21px}
.ppl-list a[aria-current="page"]::before{opacity:1}
.ppl-h:focus-visible,.ppl-list a:focus-visible{outline:2px solid var(--ppl-o);outline-offset:2px}
.ppl-ref .ppl-list a{font:400 19px/1.3 var(--ppl-fd);padding-top:11px;padding-bottom:11px}
@media(max-width:980px){.ppl:not(.ppl-nomenu) .ppl-tab{display:none}}
@media(prefers-reduced-motion:reduce){.ppl-tab,.ppl-panel,.ppl-scrim,.ppl-list a,.ppl-h span{transition:none}}
@media print{.ppl{display:none!important}}
</style>
<div class="ppl" id="ppl">
  <button class="ppl-tab" id="pplTab" type="button" aria-controls="pplPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span id="pplTabTxt" data-es="Biblioteca" data-en="Library">Biblioteca</span></button>
  <div class="ppl-scrim" id="pplScrim"></div>
  <aside class="ppl-panel" id="pplPanel" role="dialog" aria-modal="true" aria-labelledby="pplTitle" aria-hidden="true">
    <div class="ppl-head"><h2 class="ppl-title" id="pplTitle">Biblioteca</h2><button class="ppl-x" id="pplX" type="button" aria-label="Cerrar">&times;</button></div>
    <nav class="ppl-body" id="pplBody" aria-labelledby="pplTitle"></nav>
  </aside>
</div>
<script>
(function(){
  var W=document.getElementById('ppl');if(!W)return;
  var $=function(id){return document.getElementById(id);};
  var tab=$('pplTab'),panel=$('pplPanel'),scrim=$('pplScrim'),body=$('pplBody'),x=$('pplX');
  /* guide: [es url, en url, es label, en label] (labels as in the contact form topics) */
  var G=[['/guias/residencias-huracanes/','/en/guides/homes-hurricanes/','Residencias y huracanes','Residences and hurricanes'],
    ['/guias/inundacion/','/en/guides/flood/','Inundación y marejada','Flood and storm surge'],
    ['/guias/autos/','/en/guides/auto/','Autos de uso y colección','Daily and collector autos'],
    ['/guias/embarcaciones/','/en/guides/boats/','Embarcaciones y PWC','Watercraft and PWCs'],
    ['/guias/aviacion-privada/','/en/guides/private-aviation/','Aviación privada','Private aviation'],
    ['/guias/colecciones-arte-joyas/','/en/guides/collections-art-jewelry/','Colecciones, arte y joyas','Collections, art and jewelry'],
    ['/guias/umbrella-responsabilidad/','/en/guides/umbrella-liability/','Responsabilidad y umbrella','Liability and umbrella'],
    ['/guias/personal-del-hogar-legado/','/en/guides/household-staff-legacy/','Personal del hogar y legado','Household staff and legacy']];
  var T={
    es:{lib:'Biblioteca',close:'Cerrar',guides:'Guías',gAll:'/guias/',tools:'Herramientas',tAll:'/guias/#herramientas',
        tl:[['/herramientas/temporada-de-huracanes/','Temporada de huracanes'],['/herramientas/inventario-familiar/','Inventario familiar']],
        ref:[['/glosario/','Glosario'],['/preguntas-frecuentes/','Preguntas frecuentes']]},
    en:{lib:'Library',close:'Close',guides:'Guides',gAll:'/en/guides/',tools:'Tools',tAll:'/en/guides/#herramientas',
        tl:[['/en/tools/hurricane-season/','Hurricane season'],['/en/tools/family-inventory/','Family inventory']],
        ref:[['/en/glossary/','Glossary'],['/en/faq/','FAQ']]}};
  var cur=null,last=null;
  function L(){return document.documentElement.lang==='en'?'en':'es';}
  function here(h){return h===location.pathname?' aria-current="page"':'';}
  function li(a){return '<li><a href="'+a[0]+'"'+here(a[0])+'>'+a[1]+'</a></li>';}
  function render(){
    var l=L();if(l===cur)return;cur=l;var t=T[l],e=l==='en';
    body.innerHTML='<div class="ppl-sec"><a class="ppl-h" href="'+t.gAll+'">'+t.guides+' <span aria-hidden="true">&rarr;</span></a><ul class="ppl-list">'+G.map(function(g){return li([e?g[1]:g[0],e?g[3]:g[2]]);}).join('')+'</ul></div>'
      +'<div class="ppl-sec"><a class="ppl-h" href="'+t.tAll+'">'+t.tools+' <span aria-hidden="true">&rarr;</span></a><ul class="ppl-list">'+t.tl.map(li).join('')+'</ul></div>'
      +'<div class="ppl-sec ppl-ref"><ul class="ppl-list">'+t.ref.map(li).join('')+'</ul></div>';
    $('pplTitle').textContent=t.lib;$('pplTabTxt').textContent=t.lib;x.setAttribute('aria-label',t.close);
  }
  function open(src){
    render();last=document.activeElement;W.classList.add('ppl-on');
    tab.setAttribute('aria-expanded','true');panel.removeAttribute('aria-hidden');document.documentElement.style.overflow='hidden';
    setTimeout(function(){try{x.focus({preventScroll:true});}catch(e){}},60);
    try{window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'cta_click',cta:'biblioteca',cta_state:src||'tab'});}catch(e){}
  }
  function close(){
    if(!W.classList.contains('ppl-on'))return;W.classList.remove('ppl-on');
    tab.setAttribute('aria-expanded','false');panel.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';
    if(last&&last.focus){try{last.focus({preventScroll:true});}catch(e){}}
  }
  tab.addEventListener('click',function(){open('tab');});
  x.addEventListener('click',close);scrim.addEventListener('click',close);
  body.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('a'))close();});
  document.addEventListener('keydown',function(e){
    if(!W.classList.contains('ppl-on'))return;
    if(e.key==='Escape'){close();return;}
    if(e.key!=='Tab')return;
    var f=panel.querySelectorAll('a[href],button');if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  });
  /* phones: open it from the hamburger menu; pages without a menu keep the tab */
  var mm=$('mobileMenu');
  if(mm){
    var m=document.createElement('a');var t=T[L()];
    m.href=t.gAll;m.className='ppl-mm';m.setAttribute('role','button');m.setAttribute('aria-controls','pplPanel');
    m.setAttribute('data-es','Biblioteca');m.setAttribute('data-en','Library');
    m.setAttribute('data-href-es','/guias/');m.setAttribute('data-href-en','/en/guides/');
    m.textContent=t.lib;
    m.addEventListener('click',function(e){e.preventDefault();if(mm.classList.contains('show')&&typeof toggleMenu==='function')toggleMenu();open('menu');});
    var g=mm.querySelector('a[href="/guias/"],a[href="/en/guides/"]');
    if(g&&g.nextSibling)mm.insertBefore(m,g.nextSibling);else mm.appendChild(m);
  } else W.classList.add('ppl-nomenu');
  window.ppLibOpen=open;
  render();
})();
</script>
<!-- /PP LIBRARY PANEL -->
