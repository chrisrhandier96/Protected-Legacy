[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Old English links (/?lang=en) go to the real English page
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
  query = {lang = "en"}

# The English page lives in en.html and is served at /en/
# Netlify matches rules with or without the trailing slash, so a "/x -> /x/"
# 301 rule sends /x/ back to itself forever. Do not add those rules.
[[redirects]]
  from = "/en/"
  to = "/en.html"
  status = 200
  force = true

# Source files for the library (not pages): keep them off the public site
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Google Ads working files (for Christian to import): not public pages
[[redirects]]
  from = "/ads/*"
  to = "/404.html"
  status = 404
  force = true

# Test tools and hand-off notes: not public pages
[[redirects]]
  from = "/site-tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/handoff/*"
  to = "/404.html"
  status = 404
  force = true

